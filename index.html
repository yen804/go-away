<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
  // 使用簡單的變數名稱避免衝突
  const DB_URL = 'https://zjcdhfafehcbbiljevoi.supabase.co/rest/v1/';
  const DB_KEY = 'sb_publishable_8f530wHsNhiv4O7JZ--O7Q_IolVAPyF'; // 確保前後有單引號

  let db;

  // 初始化並立即在 Console 顯示狀態
  try {
    db = supabase.createClient(DB_URL, DB_KEY);
    console.log("資料庫連線初始化成功！");
  } catch (e) {
    console.error("初始化失敗:", e);
  }

  // 強制掛載到 window，解決 "Can't find variable: cloudTest"
  window.cloudTest = async function() {
    console.log("正在嘗試雲端寫入...");
    if (!db) {
      alert("連線未建立，請檢查 API Key 填寫是否正確");
      return;
    }

    const { data, error } = await db
      .from('Go_Away')
      .insert([{ name: '連線大成功', is_checked: false, category: '測試' }])
      .select();

    if (error) {
      alert('寫入失敗：' + error.message);
      console.error(error);
    } else {
      alert('成功！資料已同步到雲端');
      console.log('傳回資料:', data);
    }
  };
</script>
