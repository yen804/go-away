<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
  // 這裡請務必填入你剛剛截圖中的那兩串
  const SUPABASE_URL = 'https://zjcdhfafehcbbiljevoi.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_8f530wHsNhiv4O7JZ--O7Q_IolVAPyF';

  // 初始化（加個 try-catch 預防噴錯）
  let supabase;
  try {
    supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    console.log("Supabase 初始化成功");
  } catch (e) {
    console.error("初始化失敗:", e);
  }

  // 加上 window. 使其全域可用
  window.cloudTest = async function() {
    console.log("按鈕被點擊了！");
    if (!supabase) {
      alert("Supabase 還沒準備好");
      return;
    }

    try {
      const { data, error } = await supabase
        .from('Go_Away')
        .insert([{ name: '福岡測試-' + new Date().toLocaleTimeString(), is_checked: false, category: '必買' }])
        .select();

      if (error) throw error;
      alert('恭喜！雲端連線成功，資料已存入');
      console.log('傳回資料:', data);
    } catch (err) {
      alert('連線出錯：' + err.message);
      console.error(err);
    }
  };
</script>

<button onclick="cloudTest()" style="position:fixed; bottom:20px; right:20px; z-index:99999; padding:15px 25px; background:green; color:white; border-radius:50px; border:none; box-shadow: 0 4px 15px rgba(0,0,0,0.3); cursor:pointer; font-weight:bold;">
  雲端測試
</button>
